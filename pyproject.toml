[project]
name = "belief-revision-agent"
version = "1.0.0"
description = "Belief revision agent for propositional logic."
requires-python = ">=3.12"
dependencies = [
    "lark>=1.3.1,<2.0.0"
]

[project.scripts]
belief-revision = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "formula",
    "belief_base",
    "cnf",
    "resolution",
    "logic_parser"
]

[tool.setuptools.package-data]
"*" = ["GRAMMAR.lark"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"